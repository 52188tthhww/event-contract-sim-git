<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>事件合约模拟交易系统</title>
  <style>
    /* ═══════════════════════════════════════════
       Design System v2 — Trading Terminal
       ═══════════════════════════════════════════ */
    :root {
      --bg-deep: #070b10;
      --bg-base: #0c1117;
      --bg-card: #111820;
      --bg-hover: #161e28;
      --border: #1c2532;
      --border-active: #2d3a4a;
      --text-primary: #e6edf3;
      --text-secondary: #7d8590;
      --text-muted: #484f58;
      --accent: #2f81f7;
      --accent-dim: #1f3a5c;
      --success: #3fb950;
      --success-dim: #162816;
      --danger: #f85149;
      --danger-dim: #281616;
      --warning: #d29922;
      --warning-dim: #282216;
      --orange: #f0883e;
      --purple: #a371f7;
      --radius-sm: 6px;
      --radius: 10px;
      --radius-lg: 14px;
      --shadow-card: 0 1px 2px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.03);
      --shadow-elevated: 0 4px 12px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.04);
      --font-mono: 'SF Mono', 'Cascadia Code', 'JetBrains Mono', 'Fira Code', monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-sans);
      background: var(--bg-deep);
      color: var(--text-primary);
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }

    button {
      cursor: pointer;
      touch-action: manipulation;
      font-family: inherit;
      transition: all .15s ease;
    }
    button:active { transform: scale(.97); }

    input, select {
      font-family: inherit;
      background: var(--bg-deep);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 6px 10px;
      font-size: 13px;
      outline: none;
      transition: border-color .15s ease;
    }
    input:focus, select:focus { border-color: var(--accent); }

    table {
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border-active); }

    /* ═══════════ Animations ═══════════ */
    @keyframes priceFlashUp {
      0% { background: transparent; }
      30% { background: rgba(63,185,80,.18); }
      100% { background: transparent; }
    }
    @keyframes priceFlashDown {
      0% { background: transparent; }
      30% { background: rgba(248,81,73,.18); }
      100% { background: transparent; }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .5; }
    }
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .flash-up { animation: priceFlashUp .6s ease; }
    .flash-down { animation: priceFlashDown .6s ease; }
    .fade-in { animation: fadeInUp .3s ease; }
    .slide-in { animation: slideInRight .3s ease; }

    /* ═══════════ Mobile (<768px) ═══════════ */
    @media (max-width: 768px) {
      header { flex-direction: column !important; padding: 12px 0 !important; gap: 6px !important; }
      header h1 { font-size: 16px !important; }
      header span { font-size: 11px !important; }

      nav {
        overflow-x: auto !important;
        -webkit-overflow-scrolling: touch;
        flex-wrap: nowrap !important;
        gap: 2px !important;
        padding: 10px 0 !important;
      }
      nav button {
        flex-shrink: 0;
        padding: 6px 10px !important;
        font-size: 12px !important;
        white-space: nowrap;
      }

      #root > div { padding: 0 10px 20px !important; }

      [style*="cardRow"] { flex-direction: column !important; gap: 8px !important; }
      [style*="cardPrice"] { font-size: 22px !important; }
      [style*="1fr 1fr"] { grid-template-columns: 1fr !important; }
      [style*="repeat(6, 1fr)"] { grid-template-columns: repeat(2, 1fr) !important; gap: 8px !important; }
      [style*="repeat(4, 1fr)"] { grid-template-columns: 1fr !important; gap: 8px !important; }

      [style*="toastLayer"] > div {
        padding: 10px 12px !important; font-size: 11px !important; max-width: 280px !important;
      }

      [style*="height: 320"] { height: 200px !important; }
      [style*="height: 280"] { height: 180px !important; }
      [style*="fontSize: 18px"] { font-size: 15px !important; }
      [style*="fontSize: 28px"] { font-size: 22px !important; }

      div[style*="overflowX"] { overflow-x: auto !important; -webkit-overflow-scrolling: touch; }
      table { font-size: 11px !important; }
      th, td { padding: 4px 6px !important; }
      input[type="number"] { font-size: 14px !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
</body>
</html>
