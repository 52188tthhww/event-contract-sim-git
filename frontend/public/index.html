<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>事件合约模拟交易系统</title>
  <style>
    /* ═══════════════════════════════════════
       Design v6 — Dark Terminal + Amber Accent
       ═══════════════════════════════════════ */
    :root {
      --bg: #0b0b0b;
      --surface: #111;
      --surface-hover: #181818;
      --surface-elevated: #161616;
      --border: #1c1c1c;
      --border-light: #222;
      --text: #ebebeb;
      --text-secondary: #888;
      --text-muted: #555;
      --accent: #d4a853;
      --accent-dim: rgba(212,168,83,.1);
      --up: #ebebeb;
      --down: #666;
      --warn: #d4a853;
      --radius: 4px;
      --radius-lg: 8px;
      --radius-xl: 12px;
      --shadow: 0 0 0 1px rgba(255,255,255,.04);
      --font: -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',sans-serif;
      --font-mono: 'SF Mono','Cascadia Code','JetBrains Mono',monospace;
    }

    *{margin:0;padding:0;box-sizing:border-box}

    body{
      font-family:var(--font);
      background:var(--bg);
      color:var(--text);
      -webkit-tap-highlight-color:transparent;
      -webkit-font-smoothing:antialiased;
      line-height:1.5;
    }

    button{
      cursor:pointer;touch-action:manipulation;font-family:inherit;
      transition:background .15s,opacity .15s;
    }
    button:hover:not(:disabled){opacity:.85}
    button:active:not(:disabled){transform:scale(.98)}

    input,select{
      font-family:inherit;background:var(--bg);color:var(--text);
      border:1px solid var(--border-light);border-radius:var(--radius);
      padding:6px 10px;font-size:13px;outline:none;
      transition:border-color .15s;
    }
    input:focus,select:focus{border-color:var(--text-muted)}

    table{border-collapse:collapse;font-variant-numeric:tabular-nums;width:100%}

    ::-webkit-scrollbar{width:4px;height:4px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:2px}

    /* --- Animations --- */
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes slideRight{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:translateX(0)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
    @keyframes shimmer{0%{background-position:-300px 0}100%{background-position:300px 0}}

    .skeleton{
      background:linear-gradient(90deg,var(--surface) 25%,var(--surface-hover) 50%,var(--surface) 75%);
      background-size:300px 100%;animation:shimmer 2s infinite;border-radius:var(--radius);
    }

    /* ═══════════════════════
       Mobile — 3 breakpoints
       ═══════════════════════ */
    @media(max-width:768px){
      #root>div{padding:0 10px 20px!important}
      header{flex-direction:column!important;padding:10px 0 6px!important;gap:6px!important}
      header h1{font-size:15px!important}
      nav{overflow-x:auto!important;-webkit-overflow-scrolling:touch;flex-wrap:nowrap!important;gap:0!important;padding:4px 0!important;scrollbar-width:none;margin:0 -10px;padding-left:10px!important}
      nav::-webkit-scrollbar{display:none}
      nav button{flex-shrink:0;padding:6px 12px!important;font-size:11px!important;white-space:nowrap;min-height:38px;border-radius:var(--radius-lg)!important;margin-right:2px}

      [style*="cardRow"]{flex-direction:column!important;gap:6px!important}
      [style*="cardPrice"]{font-size:24px!important}
      [style*="1fr 1fr"]{grid-template-columns:1fr!important;gap:8px!important}
      [style*="repeat(6,1fr)"]{grid-template-columns:repeat(3,1fr)!important;gap:4px!important}
      [style*="repeat(6,1fr)"]>div{padding:8px 10px!important}
      [style*="repeat(4,1fr)"]{grid-template-columns:repeat(2,1fr)!important;gap:6px!important}

      [style*="toastLayer"]{left:6px!important;right:6px!important;max-width:none!important;top:6px!important}
      [style*="toastLayer"]>div{padding:10px!important;font-size:11px!important}

      [style*="height:320"],[style*="height:300"]{height:200px!important}
      [style*="height:280"],[style*="height:260"]{height:180px!important}
      [style*="fontSize:28px"],[style*="fontSize:30px"]{font-size:22px!important}
      [style*="fontSize:18px"]{font-size:14px!important}
      [style*="fontSize:14px"]:not(input):not(button){font-size:12px!important}

      div[style*="overflowX"]{overflow-x:auto!important;-webkit-overflow-scrolling:touch}
      table,td,th{font-size:10px!important}
      th,td{padding:5px 6px!important}

      input,select{font-size:16px!important;min-height:38px;padding:6px 10px!important}
      input[type="number"]{max-width:50px;text-align:center}
      input[type="checkbox"]{min-height:auto;width:16px;height:16px}

      [style*="marginBottom:20"]{margin-bottom:10px!important}
      [style*="padding:20px"],[style*="padding:18px"],[style*="padding:16px"]{padding:12px!important}
      [style*="padding:14px"]{padding:10px!important}
      [style*="gap:16"]{gap:8px!important}
    }

    @media(max-width:480px){
      header h1{font-size:14px!important}
      nav button{padding:5px 8px!important;font-size:10px!important;min-height:34px}
      [style*="repeat(6,1fr)"]{grid-template-columns:repeat(2,1fr)!important}
      [style*="repeat(6,1fr)"]>div{padding:6px 8px!important}
      [style*="repeat(4,1fr)"]{grid-template-columns:1fr!important}
      [style*="height:320"],[style*="height:300"]{height:160px!important}
      [style*="height:280"],[style*="height:260"]{height:150px!important}
      [style*="padding:12px"]{padding:8px!important}
    }

    @media(max-width:380px){
      nav button{font-size:0!important;padding:5px 8px!important}
      nav button span{font-size:16px!important}
    }
  </style>
</head>
<body>
  <div id="root"></div>
</body>
</html>
