<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>事件合约模拟交易系统</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f1117; color: #e1e4e8; -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; touch-action: manipulation; }

    /* ── 移动端响应式 (<768px) ── */
    @media (max-width: 768px) {
      /* 顶栏 */
      header { flex-direction: column !important; padding: 12px 0 !important; }
      header h1 { font-size: 16px !important; }
      header span { font-size: 11px !important; }

      /* 标签页 — 横向滚动 */
      nav {
        overflow-x: auto !important;
        -webkit-overflow-scrolling: touch;
        flex-wrap: nowrap !important;
        gap: 2px !important;
        padding: 10px 0 !important;
      }
      nav button {
        flex-shrink: 0;
        padding: 6px 10px !important;
        font-size: 12px !important;
        white-space: nowrap;
      }

      /* 外层容器 */
      #root > div { padding: 0 10px 20px !important; }

      /* 行情看板价格卡片 */
      [style*="cardRow"] {
        flex-direction: column !important;
        gap: 8px !important;
      }
      [style*="cardPrice"] { font-size: 22px !important; }

      /* 行情图：双列→单列 */
      [style*="1fr 1fr"] {
        grid-template-columns: 1fr !important;
      }

      /* 模拟账户 6 指标→2 列 */
      [style*="repeat(6, 1fr)"] {
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 8px !important;
      }

      /* 控制面板 4 列→1 列 */
      [style*="repeat(4, 1fr)"] {
        grid-template-columns: 1fr !important;
        gap: 8px !important;
      }

      /* Toast */
      [style*="toastLayer"] > div {
        padding: 10px 12px !important;
        font-size: 11px !important;
        max-width: 280px !important;
      }

      /* 图表高度缩小 */
      [style*="height: 320"] { height: 200px !important; }
      [style*="height: 280"] { height: 180px !important; }

      /* 卡片字号缩小 */
      [style*="fontSize: 18px"] { font-size: 15px !important; }
      [style*="fontSize: 28px"] { font-size: 22px !important; }

      /* 表格区域 */
      div[style*="overflowX"] {
        overflow-x: auto !important;
        -webkit-overflow-scrolling: touch;
      }
      table { font-size: 11px !important; }
      th, td { padding: 4px 6px !important; }

      /* 输入框 */
      input[type="number"] { font-size: 14px !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
</body>
</html>
