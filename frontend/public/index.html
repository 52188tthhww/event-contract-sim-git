<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>事件合约模拟交易系统</title>
  <style>
    /* ═══════════════════════════════════════════
       Design System v2 — Trading Terminal
       ═══════════════════════════════════════════ */
    :root {
      --bg-deep: #070b10;
      --bg-base: #0c1117;
      --bg-card: #111820;
      --bg-hover: #161e28;
      --border: #1c2532;
      --border-active: #2d3a4a;
      --text-primary: #e6edf3;
      --text-secondary: #7d8590;
      --text-muted: #484f58;
      --accent: #2f81f7;
      --accent-dim: #1f3a5c;
      --success: #3fb950;
      --success-dim: #162816;
      --danger: #f85149;
      --danger-dim: #281616;
      --warning: #d29922;
      --warning-dim: #282216;
      --orange: #f0883e;
      --purple: #a371f7;
      --radius-sm: 6px;
      --radius: 10px;
      --radius-lg: 14px;
      --shadow-card: 0 1px 2px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.03);
      --shadow-elevated: 0 4px 12px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.04);
      --font-mono: 'SF Mono', 'Cascadia Code', 'JetBrains Mono', 'Fira Code', monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-sans);
      background: var(--bg-deep);
      color: var(--text-primary);
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }

    button {
      cursor: pointer;
      touch-action: manipulation;
      font-family: inherit;
      transition: all .15s ease;
    }
    button:active { transform: scale(.97); }

    input, select {
      font-family: inherit;
      background: var(--bg-deep);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 6px 10px;
      font-size: 13px;
      outline: none;
      transition: border-color .15s ease;
    }
    input:focus, select:focus { border-color: var(--accent); }

    table {
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border-active); }

    /* ═══════════ Animations ═══════════ */
    @keyframes priceFlashUp {
      0% { background: transparent; }
      30% { background: rgba(63,185,80,.18); }
      100% { background: transparent; }
    }
    @keyframes priceFlashDown {
      0% { background: transparent; }
      30% { background: rgba(248,81,73,.18); }
      100% { background: transparent; }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .5; }
    }
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .flash-up { animation: priceFlashUp .6s ease; }
    .flash-down { animation: priceFlashDown .6s ease; }
    .fade-in { animation: fadeInUp .3s ease; }
    .slide-in { animation: slideInRight .3s ease; }

    /* ═══════════ Mobile: Tablet (<768px) ═══════════ */
    @media (max-width: 768px) {
      /* Override any click-triggered scale */
      button:active { transform: none; }

      /* Header */
      header {
        flex-direction: column !important;
        padding: 10px 0 !important;
        gap: 8px !important;
      }
      header h1 { font-size: 15px !important; letter-spacing: 0 !important; }
      header [style*="sourceBadge"] { align-self: flex-start; }
      header [style*="headerLeft"], header [style*="headerRight"] {
        width: 100% !important;
      }

      /* Tabs */
      nav {
        overflow-x: auto !important;
        -webkit-overflow-scrolling: touch;
        flex-wrap: nowrap !important;
        gap: 2px !important;
        padding: 8px 0 !important;
        scrollbar-width: none;
      }
      nav::-webkit-scrollbar { display: none; }
      nav button {
        flex-shrink: 0;
        padding: 7px 12px !important;
        font-size: 11px !important;
        white-space: nowrap;
        min-height: 38px;
        border-radius: 8px !important;
      }

      /* Container */
      #root > div { padding: 0 8px 20px !important; }

      /* Price cards */
      [style*="cardRow"] { flex-direction: column !important; gap: 8px !important; }
      [style*="cardPrice"] { font-size: 24px !important; }

      /* Charts: 2-col → 1-col */
      [style*="1fr 1fr"] { grid-template-columns: 1fr !important; }

      /* Overview: 6-col → 3-col */
      [style*="repeat(6, 1fr)"] { grid-template-columns: repeat(3, 1fr) !important; gap: 6px !important; }
      [style*="repeat(6, 1fr)"] > div { padding: 10px 12px !important; }

      /* Control panel: 4-col → 2-col on tablet, 1-col on phone */
      [style*="repeat(4, 1fr)"] { grid-template-columns: repeat(2, 1fr) !important; gap: 8px !important; }

      /* Toast */
      [style*="toastLayer"] {
        left: 8px !important; right: 8px !important; max-width: none !important;
      }
      [style*="toastLayer"] > div {
        padding: 10px 12px !important; font-size: 12px !important;
      }

      /* Charts */
      [style*="height: 320"] { height: 200px !important; }
      [style*="height: 280"] { height: 180px !important; }
      [style*="fontSize: 18px"] { font-size: 14px !important; }

      /* Tables: full-width horizontal scroll */
      div[style*="overflowX"], div[style*="overflow-x"] {
        overflow-x: auto !important;
        -webkit-overflow-scrolling: touch;
      }
      table { font-size: 10px !important; }
      th, td { padding: 4px 5px !important; }

      /* Form elements */
      input, select, button { font-size: 14px !important; min-height: 36px; }
      input[type="number"] { font-size: 14px !important; width: auto !important; max-width: 60px; }
      input[type="checkbox"] { min-height: auto; }

      /* Section spacing */
      [style*="marginBottom: 20"] { margin-bottom: 14px !important; }
      [style*="marginBottom: 16"] { margin-bottom: 10px !important; }
      [style*="padding: 16px 20px"] { padding: 12px 14px !important; }
      [style*="padding: 14px 18px"] { padding: 10px 12px !important; }

      /* Sub-section cards */
      [style*="section"] [style*="background"] {
        margin-bottom: 8px !important;
      }
    }

    /* ═══════════ Mobile: Phone (<480px) ═══════════ */
    @media (max-width: 480px) {
      header h1 { font-size: 14px !important; }
      header [style*="tickerPrice"] { font-size: 12px !important; }
      header [style*="tickerLabel"] { font-size: 9px !important; }

      nav button { padding: 6px 8px !important; font-size: 10px !important; min-height: 32px; }
      nav button span { font-size: 13px !important; }

      [style*="repeat(6, 1fr)"] { grid-template-columns: repeat(2, 1fr) !important; gap: 4px !important; }
      [style*="repeat(6, 1fr)"] > div { padding: 8px 10px !important; }
      [style*="repeat(4, 1fr)"] { grid-template-columns: 1fr !important; }

      [style*="cardPrice"] { font-size: 20px !important; }
      [style*="height: 320"] { height: 150px !important; }
      [style*="height: 280"] { height: 140px !important; }
    }

    /* ═══════════ Mobile: Small Phone (<400px) ═══════════ */
    @media (max-width: 400px) {
      header h1 { font-size: 13px !important; }
      nav button { font-size: 0 !important; padding: 6px 10px !important; }
      nav button span { font-size: 18px !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
</body>
</html>
